[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
no_match_path = "test/fork/*"
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[profile.fork]
no_match_path = "test/never/*"
